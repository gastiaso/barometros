# Construye los datos armonizados y publica la web en GitHub Pages.
# Se ejecuta con cada cambio en main y a mano (Actions > Publicar > Run workflow). El modo veda (sin series
# electorales) solo se activa a mano, marcando la casilla al lanzar el flujo. En las pull requests construye y
# comprueba la web, pero no la publica: el resultado de la prueba aparece en la propia pull request.
name: Publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      veda:
        description: "Forzar el modo veda (sin series electorales)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  construir:
    # Versión fija: desde noviembre de 2026 ubuntu-latest es Ubuntu 26.04, y Playwright 1.56 no instala Chromium ahí
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Comprobación estática de web/js (variables no definidas o sin usar, igualdad estricta) antes de construir nada
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar web/js (eslint)
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extraer los .sav de los ZIP del CIS
        run: python scripts/00_extraer.py .

      # Versión de R y fecha del repositorio de paquetes fijadas: el mismo entorno en cada construcción hasta que se
      # cambien a mano (y se anote en CHANGELOG.md). La fecha es una instantánea de Posit Package Manager con binarios
      # para Ubuntu 24.04; para actualizar los paquetes basta adelantarla.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"
          use-public-rspm: true
      - name: Repositorio de paquetes de R fijado por fecha
        run: echo 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/2026-11-06"))' >> ~/.Rprofile
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::targets
            any::haven
            any::arrow
            any::dplyr
            any::tidyr
            any::purrr
            any::readr
            any::jsonlite
            any::tibble
            any::testthat

      - name: Pruebas unitarias de R (testthat)
        run: Rscript tests/testthat.R

      - name: Armonizar y validar (targets)
        run: Rscript -e 'targets::tar_make()'

      - name: Modo de publicación
        run: |
          if [ "${{ inputs.veda }}" = "true" ]; then echo "VEDA=1" >> "$GITHUB_ENV"; echo "Modo veda (manual)"; else echo "VEDA=0" >> "$GITHUB_ENV"; fi

      - name: Datos de la web
        run: Rscript scripts/07_web.R

      # La rejilla de «Construye tu estimación» se calcula aparte (estimacion/rejilla.R, cerca de una hora) y se
      # guarda en el repositorio; aquí solo se pasa a la web. En modo veda no se publica.
      - name: Datos de la estimación
        run: Rscript scripts/07_estimacion.R

      - name: Comprobar que la web calcula igual que R y que el CIS
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/08_prueba_web.py .

      - name: Imagen de vista previa
        run: python scripts/09_vista_previa.py .

      # Versión en las direcciones de los scripts y la hoja de estilos: tras cada publicación el navegador
      # descarga los nuevos en lugar de mezclarlos con los que tenga en caché.
      - name: Versión de los ficheros de la web
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src=\"js/[^\"?]+\.js)\"#\1?v=$v\"#g; s#(href=\"css/[^\"?]+\.css)\"#\1?v=$v\"#g" web/index.html
          grep -c "?v=$v" web/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web

  desplegar:
    needs: construir
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
